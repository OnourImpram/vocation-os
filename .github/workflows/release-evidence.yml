name: release-evidence

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  verify:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run safe:publish-check
      - name: Build package archive
        run: npm pack
      - name: Generate CycloneDX SBOM
        run: npm sbom --sbom-format cyclonedx --package-lock-only > vocation-os.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vocation-os-release-evidence
          if-no-files-found: error
          retention-days: 30
          path: |
            *.tgz
            vocation-os.cdx.json

  attest-and-publish:
    needs: verify
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vocation-os-release-evidence
          path: release-evidence
      - name: Attest package provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: "release-evidence/*.tgz"
      - name: Attest package SBOM
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: "release-evidence/*.tgz"
          sbom-path: release-evidence/vocation-os.cdx.json
      - name: Publish durable GitHub release evidence
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --title "VocationOS $GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" release-evidence/*.tgz release-evidence/vocation-os.cdx.json --repo "$GITHUB_REPOSITORY" --clobber
