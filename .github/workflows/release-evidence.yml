name: release-evidence

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  verify:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run safe:publish-check
      - name: Build package archive
        run: npm pack
      - name: Generate CycloneDX SBOM
        run: npm sbom --sbom-format cyclonedx --package-lock-only > vocation-os.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vocation-os-release-evidence
          if-no-files-found: error
          retention-days: 30
          path: |
            *.tgz
            vocation-os.cdx.json

  attest-and-publish:
    needs: verify
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vocation-os-release-evidence
          path: release-evidence
      - name: Attest package provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: "release-evidence/*.tgz"
      - name: Attest package SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: "release-evidence/*.tgz"
          sbom-path: release-evidence/vocation-os.cdx.json
      - name: Publish durable GitHub release evidence
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --title "VocationOS $GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" release-evidence/*.tgz release-evidence/vocation-os.cdx.json --repo "$GITHUB_REPOSITORY" --clobber
